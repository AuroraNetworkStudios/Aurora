register-commands:
  - "examplemenu"

title: "&6Example Menu"
rows: 6
refresh: false

open-requirements:
  - requirement: "[permission] examplemenu.open"
    deny-actions:
      - "[message] &cYou do not have permission to open this menu."

open-actions:
  - "[sound] entity.villager.yes"

close-actions:
  - "[sound] entity.villager.no"

filler:
  material: black_stained_glass_pane
  hide-tooltip: true

items:
  test:
    priority: 1
    material: diamond
    name: "&6Test Item"
    lore:
      - "&7This is a test item."
    slot: 13
    on-click:
      - "[console] say Hello test!"
    view-requirements:
      - "[permission] example.permission"
      #- "[money] 1000"
      #- "[exp-level] 30"
      #- "[placeholder] %my_placeholder% == 10"
      #- "[placeholder] %my_placeholder% > 10"
      #- "[placeholder] %my_placeholder% >= 10"
      #- "[placeholder] %my_placeholder% <= 10"
    click-requirements:
      - requirement: "[permission] example.permission.2"
        deny-actions:
          - "[message] &cYou do not have permission to use this item."
  test2:
    priority: 0
    material: emerald
    name: "&6Test Item"
    lore:
      - "&7This is a test item."
    slot: 13
    on-click:
      - "[console] lp user {player} permission set example.permission"
  delayed:
    material: clock
    name: "&6Delayed actions"
    slot: 22
    click-requirements:
      - requirement: "[money] 100"
        deny-actions:
          - "[message] &cYou need 100 coins."
    on-click:
      - "[close]"
      - "[console] lp user {player} permission settemp example.temp true 10s"
      # [delay: ticks] waits before the actions below it (20 ticks = 1 second).
      # [delay:20], [delay 20] and [delay] 20 work as well.
      # The click requirements are checked again after the delay, the actions below it only run if they still pass.
      # If the player leaves the server before that, the remaining actions are skipped.
      - "[delay: 20]"
      - "[take-money] 100"
      - "[player] say I waited a second"